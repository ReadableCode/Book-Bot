[project]
name = "book_bot"
version = "1.0.0"
description = "book-bot // personal library terminal — scan barcodes, track owned editions and wishlist"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "requests>=2.32.3",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.10",
    "google-auth>=2.55.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
